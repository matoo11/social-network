version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: social-network-backend
    ports:                   
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - backend_data:/app/backend/pkg/db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: social-network-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
